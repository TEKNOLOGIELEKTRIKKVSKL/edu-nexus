<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDU NEXUS V2.0</title><style>
*{box-sizing:border-box}body{margin:0;background:#030914;color:#e9fcff;font:18px system-ui;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,#12405488,transparent 70%),repeating-linear-gradient(90deg,transparent 0 79px,#22d3ee0c 80px);pointer-events:none}main{position:relative;min-height:100dvh;display:grid;align-content:center;justify-items:center;text-align:center;padding:24px}h1{color:#e4c36a;font-size:clamp(28px,5vw,72px);letter-spacing:.1em}button,input{font:inherit;padding:12px;border:1px solid #22d3ee;background:#102736;color:white;border-radius:8px;margin:5px}button{cursor:pointer}button:disabled{opacity:.5}small,a{color:#83dce8}#reactor{width:min(65vw,45vh);aspect-ratio:1;border:3px solid #22d3ee;border-radius:50%;display:grid;place-items:center;margin:20px auto;position:relative;box-shadow:0 0 55px #22d3ee55,inset 0 0 50px #22d3ee44;font-size:4rem;color:#e4c36a}#reactor:before,#reactor:after{content:'';position:absolute;inset:-16px;border:5px dashed #22d3ee;border-radius:50%;animation:spin 18s linear infinite;pointer-events:none}#reactor:after{inset:14px;border:2px dashed #d4af37;animation-direction:reverse}@keyframes spin{to{transform:rotate(360deg)}}.nodes,.team{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:24px}.node,.team div{border:1px solid #35566a;padding:12px}.on{color:#e4c36a;box-shadow:0 0 20px #22d3ee}.profile{display:grid;grid-template-columns:40% 1fr;align-items:center;width:90vw;text-align:left;gap:24px}.portrait{position:relative;text-align:center;perspective:800px}.portrait img{max-width:95%;height:55vh;object-fit:contain;animation:turn 9s ease-in-out infinite;filter:drop-shadow(0 0 24px #22d3ee66)}@keyframes turn{50%{transform:rotateY(22deg) translateY(-8px)}}.platform{height:40px;border:3px solid #22d3ee;border-radius:50%;box-shadow:0 0 30px #22d3ee}.card{padding:10px 16px;border-left:3px solid #22d3ee;background:#12384c99;margin:8px 0;animation:appear .8s both}@keyframes appear{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}.scan{position:absolute;left:0;right:0;height:3px;background:#22d3ee;animation:scan 3s linear infinite}@keyframes scan{from{top:0}to{top:90%}}.team img{height:100px;max-width:120px;object-fit:contain}.logo{max-width:35vw;max-height:35vh;object-fit:contain}.slider{width:min(85vw,420px);accent-color:#22d3ee}#notice{position:fixed;bottom:8px;left:8px;right:8px;color:#ffce99;font-size:14px;overflow-wrap:anywhere}#audioButton{position:fixed;top:8px;right:8px;font-size:12px}body.paused *{animation-play-state:paused!important}@media(max-width:600px){.profile{grid-template-columns:1fr}.portrait img{height:28vh}}
</style><main id="app">Loading EDU NEXUS…</main><div id="notice" role="status"></div><button id="audioButton" hidden>Audio / Skrin penuh</button><script>
const API='https://script.google.com/macros/s/AKfycbyP5nANrwgwDyLohoRYe5Ns3JGbYp2Ce1sx0R0fXLGZUaJsHkfHmidOpIn4NfVJeCobpQ/exec';
const q=new URLSearchParams(location.search),mode=q.get('mode')||'display',app=document.querySelector('#app'),notice=document.querySelector('#notice'),audioButton=document.querySelector('#audioButton');
let state,conf={settings:{},lecturers:[]},key='',last='',session='',busy=false,writing=false,epoch=0,offset=0,connected=false,message='',music=null,narration=null,spoken='',audioEnabled=false,ready=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function url(v){try{const u=new URL(v);return u.protocol==='https:'?esc(u.href):''}catch{return ''}}
function report(){notice.textContent=(mode==='admin'?(connected?'CONNECTED | ':'DISCONNECTED | '):'')+message;}
async function api(action='status',extra={}){
 const read=['status','config'].includes(action),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try{const params=new URLSearchParams({action,...extra,_:Date.now()});const r=await fetch(read?API+'?'+params:API,{method:read?'GET':'POST',...(read?{}:{body:params}),redirect:'follow',signal:controller.signal});const text=await r.text();if(!r.ok)throw Error('HTTP '+r.status);let j;try{j=JSON.parse(text)}catch{throw Error('Respons bukan JSON. Semak deployment dan akses Anyone.')}if(j.version!=='2.0')throw Error('Backend bukan V2.0. Deploy New version dahulu.');if(!j.ok)throw Error(j.error);return j;}catch(e){throw Error(e.name==='AbortError'?'API timeout; semak status sebelum ulang arahan':e.message)}finally{clearTimeout(timer)}
}
function accept(r){state=r.state;offset=(r.serverTime||Date.now())-Date.now();connected=true;render();}
function stopAudio(){window.speechSynthesis?.cancel();if(narration){narration.pause();narration=null}if(music){music.pause();music.currentTime=0}spoken='';}
function syncAudio(phase,paused){if(!audioEnabled||mode==='admin'||mode==='unlock')return;if(music){if(phase==='standby'||paused)music.pause();else music.play().catch(()=>{});}if(paused){window.speechSynthesis?.pause();narration?.pause()}else{window.speechSynthesis?.resume();if(narration&&!narration.ended)narration.play().catch(()=>{})}}
audioButton.onclick=()=>{audioEnabled=true;if(conf.settings.music&&!music){music=new Audio(conf.settings.music);music.loop=true;music.volume=.3;music.play().then(()=>{if(state?.phase==='standby')music.pause()}).catch(()=>{})}document.documentElement.requestFullscreen?.().catch(()=>{});audioButton.hidden=true;};
function speak(r,k){if(spoken===k)return;spoken=k;window.speechSynthesis?.cancel();if(narration){narration.pause();narration=null}if(!audioEnabled||String(conf.settings.narrator).toUpperCase()!=='ON')return;if(url(r[14])){narration=new Audio(r[14]);narration.play().catch(()=>{});}else if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(r[13]||r[1]+' '+r[2]);u.lang='ms-MY';speechSynthesis.speak(u)}}
function duration(r){const n=Number(r[11]||conf.settings.seconds||30);return Number.isFinite(n)&&n>0?n:30}
function scene(){let s=state,t=Math.max(0,(s.paused?s.elapsed:Date.now()+offset-s.at)/1000),phase=s.phase,i=s.index,ls=conf.lecturers;if(phase==='opening'&&t>=20){phase='profile';t-=20;i=0}if(phase==='profile'){while(i<ls.length&&t>=duration(ls[i])+3){t-=duration(ls[i])+3;i++}if(i>=ls.length)phase='finale'}return {phase,i,t,n:s.locks.filter(Boolean).length}}
function render(){if(!state||!ready)return;if(session!==state.session){session=state.session;last='';stopAudio()}const {phase,i,t,n}=scene(),s=state,ls=conf.lecturers,settings=conf.settings;document.body.classList.toggle('paused',s.paused);const stamp=[mode,session,phase,i,n,s.at].join('|');
 if(mode==='admin'){const el=document.querySelector('#status');if(el)el.textContent=`${n*25}% | ${phase} | Profil ${i+1} | ${Math.floor(t)}s`;return}
 if(mode==='unlock'){if(stamp===last)return;last=stamp;const on=s.locks[Number(q.get('id'))-1];app.innerHTML=`<h1>EDU NEXUS</h1><div id="reactor">${on?'✓':'🔒'}</div><h2>PERASMI ${esc(q.get('id'))}</h2>${on?'<p>ENERGY TRANSFERRED</p>':phase!=='standby'?'<p>WAITING FOR RESET</p>':!q.get('token')?'<p>Pautan tidak lengkap. Dapatkan pautan daripada admin.</p>':'<p>SLIDE TO UNLOCK</p><input class="slider" type="range" min="0" max="100" value="0" aria-label="Slide to unlock" oninput="if(this.value==100){this.disabled=true;unlock()}">'}`;return}
 syncAudio(phase,s.paused);
 if(stamp!==last){last=stamp;if(phase==='standby'){app.innerHTML=`<small>QUAD ENERGY ACTIVATION</small><h1>EDU NEXUS</h1><div id="reactor">${n*25}%</div><div class="nodes">${s.locks.map((v,j)=>`<div class="node ${v?'on':''}">UNIT 0${j+1}<br>${v?'VERIFIED':'LOCKED'}</div>`).join('')}</div>`}
 else if(phase==='opening'){app.innerHTML='<div id="reactor">100%</div><h1 id="openingTitle">ENERGY FUSION</h1><div id="logo"></div>'}
 else if(phase==='profile'){const r=ls[i];app.innerHTML=`<small>PERSONNEL IDENTITY // ${i+1}</small><div class="profile"><div class="portrait">${url(r[10])?`<img src="${url(r[10])}">`:'<h1>◈</h1>'}<div class="scan"></div><div class="platform"></div></div><section><h1 id="person"></h1><div id="cards"></div></section></div>`;speak(r,stamp)}
 else{window.speechSynthesis?.cancel();if(narration){narration.pause();narration=null}app.innerHTML=`<h1>${esc(settings.title||'EDU NEXUS')}</h1>${url(settings.logo)?`<img class="logo" src="${url(settings.logo)}">`:''}<h2>MEET OUR LECTURERS</h2><div class="team">${ls.map(r=>`<div>${url(r[10])?`<img src="${url(r[10])}">`:''}<p>${esc(r[1])}</p></div>`).join('')}</div>`}}
 if(phase==='opening'){document.querySelector('#openingTitle').textContent=t<6?'ENERGY FUSION':t<12?'SYSTEM ACTIVATED':settings.title||'EDU NEXUS';const l=document.querySelector('#logo');if(t>=12&&!l.innerHTML&&url(settings.logo))l.innerHTML=`<img class="logo" src="${url(settings.logo)}">`}
 if(phase==='profile'){const r=ls[i],p=t/duration(r);document.querySelector('#person').textContent=r[1].slice(0,Math.max(0,Math.floor((p-.15)*r[1].length*8)));const cards=document.querySelector('#cards');['Jawatan','Jabatan','Akademik','Profesional','Pengalaman','Kepakaran','Pencapaian','Moto'].forEach((f,j)=>{if(r[j+2]&&p>.25+j*.075&&!document.getElementById('f'+j)){const d=document.createElement('div');d.id='f'+j;d.className='card';d.innerHTML=`<small>${f}</small><br>${esc(r[j+2])}`;cards.append(d)}})}
}
async function poll(){if(busy||writing||mode==='preview')return;busy=true;const v=epoch;try{const r=await api();if(v===epoch&&!writing){accept(r);if(mode!=='admin')message='';report()}}catch(e){if(v===epoch){connected=false;message=e.message;report()}}finally{busy=false}}
async function mutate(action,extra){if(writing)return;writing=true;epoch++;document.querySelectorAll('button.command').forEach(b=>b.disabled=true);message='Menghantar '+action+'…';report();try{const r=await api(action,extra);if(['reset','standby','stop'].includes(action)&&(r.state.phase!=='standby'||r.state.locks.some(Boolean)))throw Error('Reset tidak disahkan');accept(r);message=['reset','standby','stop'].includes(action)?'RESET BERJAYA — 0% / 4 LOCKED':'Arahan berjaya: '+action;}catch(e){message='Arahan gagal: '+e.message;last='';render()}finally{writing=false;document.querySelectorAll('button.command').forEach(b=>b.disabled=false);report()}}
function command(a){return mutate(a,{key})}
function unlock(){return mutate('unlock',{id:q.get('id'),token:q.get('token'),session:state.session})}
async function login(){key=document.querySelector('#key').value.trim();try{const r=await api('links',{key});app.innerHTML='<h1>COMMAND CENTER V2.0</h1><p id="status"></p><div>'+Object.entries({start:'Emergency Start',pause:'Pause',resume:'Resume',prev:'Previous',next:'Next',replay:'Replay Profile',profiles:'Skip Opening',finale:'Finale',restart:'Replay Presentation',stop:'Stop',reset:'RETURN TO STANDBY / RESET SYSTEM'}).map(([a,b])=>`<button class="command" onclick="command('${a}')">${b}</button>`).join('')+'</div><h2>Device links</h2>'+r.data.map(d=>{const u=new URL(location.href);u.search=new URLSearchParams({mode:'unlock',id:d[0],token:d[1]});return `<p><a href="${esc(u.href)}" target="_blank" rel="noopener">Perasmi ${esc(d[0])}</a> <button onclick="navigator.clipboard.writeText(this.previousElementSibling.href).catch(()=>{message='Copy gagal; salin pautan secara manual';report()})">Copy</button></p>`}).join('');accept(r);message='Admin authenticated';report()}catch(e){message=e.message;report()}}
async function init(){if(mode==='admin')app.innerHTML='<h1>EDU NEXUS ADMIN V2.0</h1><input id="key" type="password" placeholder="Admin key"><button onclick="login()">Login</button>';else if(mode!=='unlock')audioButton.hidden=false;try{const r=await api('config');conf=r.data;ready=true;accept(r);if(mode==='preview'){state={...state,session:'preview',phase:'opening',at:Date.now()+offset,locks:[true,true,true,true],index:0,paused:false,elapsed:0};render()}report()}catch(e){message=e.message;report();setTimeout(init,5000);return}setInterval(poll,2200);setInterval(render,150)}init();
</script></html>

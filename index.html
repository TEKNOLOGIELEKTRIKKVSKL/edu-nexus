<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDU NEXUS</title><style>
*{box-sizing:border-box}body{margin:0;background:#030914;color:#e9fcff;font:18px system-ui;overflow-x:hidden}main{min-height:100dvh;display:grid;place-content:center;text-align:center;padding:24px;position:relative}body:before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,#12405466,transparent 65%),repeating-linear-gradient(90deg,transparent 0 79px,#22d3ee0c 80px),repeating-linear-gradient(0deg,transparent 0 79px,#22d3ee0c 80px);pointer-events:none}h1{color:#e4c36a;font-size:clamp(28px,5vw,72px);letter-spacing:.12em}button,input{font:inherit;padding:12px;border:1px solid #22d3ee;background:#102736;color:white;border-radius:8px;margin:5px}button{cursor:pointer}small{color:#83dce8}#reactor{width:min(65vw,45vh);aspect-ratio:1;border:3px solid #22d3ee;border-radius:50%;display:grid;place-items:center;margin:auto;position:relative;box-shadow:0 0 55px #22d3ee55,inset 0 0 50px #22d3ee44;font-size:4rem;color:#e4c36a}#reactor:before,#reactor:after{content:'';position:absolute;inset:-16px;border:5px dashed #22d3ee;border-radius:50%;animation:spin 18s linear infinite}#reactor:after{inset:14px;border:2px dashed #d4af37;animation-direction:reverse}@keyframes spin{to{transform:rotate(360deg)}}.nodes{display:flex;justify-content:center;gap:12px;margin:32px}.node{border:1px solid #35566a;padding:12px}.on{color:#e4c36a;box-shadow:0 0 20px #22d3ee}.profile{display:grid;grid-template-columns:40% 60%;align-items:center;width:90vw;text-align:left;gap:24px}.portrait{position:relative;text-align:center;perspective:800px}.portrait img{max-width:95%;height:55vh;object-fit:contain;animation:turn 9s ease-in-out infinite;filter:drop-shadow(0 0 24px #22d3ee66)}@keyframes turn{50%{transform:rotateY(22deg) translateY(-8px)}}.platform{height:40px;border:3px solid #22d3ee;border-radius:50%;box-shadow:0 0 30px #22d3ee}.card{padding:10px 16px;border-left:3px solid #22d3ee;background:#12384c99;margin:8px 0;animation:appear .8s both}@keyframes appear{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}.scan{position:absolute;left:0;right:0;height:3px;background:#22d3ee;box-shadow:0 0 20px cyan;animation:scan 3s linear infinite}@keyframes scan{from{top:0}to{top:90%}}.team{display:flex;flex-wrap:wrap;justify-content:center;gap:15px}.team img{height:100px;max-width:120px;object-fit:contain}.team div{border:1px solid #d4af37;padding:12px}.slider{width:min(85vw,420px);accent-color:#22d3ee}.opening{animation:appear 2s both}.logo{max-width:35vw;max-height:35vh;object-fit:contain}#err{position:fixed;bottom:8px;left:8px;color:#ffb4a9;font-size:13px}a{color:#67e8f9} @media(max-width:600px){.profile{grid-template-columns:1fr}.portrait img{height:28vh}.nodes{gap:4px;margin:25px 0}.node{padding:5px}}
</style><main id="app">Loading EDU NEXUS…</main><div id="err"></div><script>
const API='PASTE_APPS_SCRIPT_EXEC_URL';const q=new URLSearchParams(location.search),mode=q.get('mode')||'display',app=document.querySelector('#app'),err=document.querySelector('#err');let state,conf={settings:{},lecturers:[]},key='',last='',busy=false,spoken='',audio,local=false;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const url=v=>{try{let u=new URL(v);return u.protocol==='https:'?esc(u.href):''}catch{return ''}};
async function api(action='status',extra={}){let r=await fetch(API+'?'+new URLSearchParams({action,...extra,_:Date.now()}),{redirect:'follow'});let j=await r.json();if(!j.ok)throw Error(j.error);return j}async function command(action){try{state=(await api(action,{key})).state;last='';render()}catch(e){err.textContent=e.message}}async function unlock(){try{state=(await api('unlock',{id:q.get('id'),token:q.get('token'),session:state.session})).state;last='';render()}catch(e){err.textContent=e.message}}function enable(){document.documentElement.requestFullscreen?.().catch(()=>{});if(conf.settings.music){audio=new Audio(conf.settings.music);audio.loop=true;audio.volume=.3;audio.play().catch(()=>{})}document.querySelector('#enable')?.remove()}function speak(r,k){if(spoken===k)return;spoken=k;window.speechSynthesis?.cancel();if(conf.settings.narrator!=='ON')return;if(r[14]){new Audio(r[14]).play().catch(()=>{});return}if(window.speechSynthesis){let u=new SpeechSynthesisUtterance(r[13]||r[1]+' '+r[2]);u.lang='ms-MY';speechSynthesis.speak(u)}}
function render(){if(!state)return;let s=state,n=s.locks.filter(Boolean).length,t=(s.paused?s.elapsed:Date.now()-s.at)/1000,ls=conf.lecturers,settings=conf.settings;let phase=s.phase,i=s.index;if(phase==='opening'&&t>=20){phase='profile';t-=20;i=0}if(phase==='profile'){while(i<ls.length&&t>=Number(ls[i][11]||settings.seconds||30)+3){t-=Number(ls[i][11]||settings.seconds||30)+3;i++}if(i>=ls.length)phase='finale'}let stamp=mode+'|'+s.session+'|'+phase+'|'+i+'|'+n+'|'+s.paused;if(mode==='unlock'){if(stamp===last)return;last=stamp;let on=s.locks[Number(q.get('id'))-1];app.innerHTML=`<h1>EDU NEXUS</h1><div id="reactor">${on?'✓':'🔒'}</div><h2>PERASMI ${esc(q.get('id'))}</h2>${on?'<p>ENERGY TRANSFERRED</p>':'<p>SLIDE TO UNLOCK</p><input class="slider" type="range" min="0" max="100" value="0" aria-label="Slide to unlock" oninput="if(this.value==100){this.disabled=true;unlock()}">'} `;return}if(mode==='admin'){if(!document.querySelector('#status'))return;document.querySelector('#status').textContent=`${n}/4 | ${phase} | Profil ${i+1} | ${Math.floor(t)}s`;return}if(stamp!==last){last=stamp;if(phase==='standby'){app.innerHTML=`<small>QUAD ENERGY ACTIVATION</small><h1>EDU NEXUS</h1><div id="reactor">${n*25}%</div><div class="nodes">${s.locks.map((v,j)=>`<div class="node ${v?'on':''}">UNIT 0${j+1}<br>${v?'VERIFIED':'LOCKED'}</div>`).join('')}</div><button id="enable" onclick="enable()">Aktifkan audio / skrin penuh</button>`}else if(phase==='opening'){app.innerHTML='<div class="opening"><div id="reactor">100%</div><h1 id="openingTitle">ENERGY FUSION</h1><div id="logo"></div></div>'}else if(phase==='profile'){let r=ls[i];app.innerHTML=`<small>PERSONNEL IDENTITY // ${i+1}</small><div class="profile"><div class="portrait">${url(r[10])?`<img src="${url(r[10])}">`:'<h1>◈</h1>'}<div class="scan"></div><div class="platform"></div></div><section><h1 id="person"></h1><div id="cards"></div></section></div>`;speak(r,s.session+i+s.at)}else{app.innerHTML=`<h1>${esc(settings.title||'EDU NEXUS')}</h1>${url(settings.logo)?`<img class="logo" src="${url(settings.logo)}" style="margin:auto">`:''}<h2>MEET OUR LECTURERS</h2><div class="team">${ls.map(r=>`<div>${url(r[10])?`<img src="${url(r[10])}">`:''}<p>${esc(r[1])}</p></div>`).join('')}</div>`}}if(phase==='opening'){document.querySelector('#openingTitle').textContent=t<6?'ENERGY FUSION':t<12?'SYSTEM ACTIVATED':settings.title||'EDU NEXUS';let l=document.querySelector('#logo');if(t>=12&&!l.innerHTML&&url(settings.logo))l.innerHTML=`<img class="logo" src="${url(settings.logo)}">`}if(phase==='profile'){let r=ls[i],duration=Number(r[11]||settings.seconds||30),p=t/duration;document.querySelector('#person').textContent=r[1].slice(0,Math.max(0,Math.floor((p-.15)*r[1].length*8)));let fields=['Jawatan','Jabatan','Akademik','Profesional','Pengalaman','Kepakaran','Pencapaian','Moto'];let cards=document.querySelector('#cards');fields.forEach((f,j)=>{if(r[j+2]&&p>.25+j*.075&&!document.getElementById('f'+j)){let d=document.createElement('div');d.id='f'+j;d.className='card';d.innerHTML=`<small>${f}</small><br>${esc(r[j+2])}`;cards.append(d)}})}}
async function poll(){if(busy)return;busy=true;try{state=(await api()).state;err.textContent='';render()}catch(e){err.textContent='Connection: '+e.message}finally{busy=false}}async function login(){key=document.querySelector('#key').value;try{let r=await api('links',{key});app.innerHTML='<h1>COMMAND CENTER</h1><p id="status"></p><div>'+['start','pause','resume','prev','next','replay','profiles','finale','reset'].map(a=>`<button onclick="command('${a}')">${a}</button>`).join('')+'</div><h2>Device links</h2>'+r.data.map(d=>{let u=new URL(location.href);u.search='';u.search=new URLSearchParams({mode:'unlock',id:d[0],token:d[1]});return `<p><a href="${esc(u.href)}" target="_blank">Perasmi ${esc(d[0])}</a> <button onclick="navigator.clipboard.writeText(this.previousElementSibling.href)">Copy</button></p>`}).join('');render()}catch(e){err.textContent=e.message}}async function init(){if(mode==='admin')app.innerHTML='<h1>EDU NEXUS ADMIN</h1><input id="key" type="password" placeholder="Admin key"><button onclick="login()">Login</button>';try{conf=(await api('config')).data;await poll()}catch(e){err.textContent=e.message}setInterval(poll,1800);setInterval(render,150)}init();</script></html>

</style><main id="app">Loading EDU NEXUS…</main><div id="notice" role="status"></div><button id="audioButton" hidden>Audio / Skrin penuh</button><script>
const API='https://script.google.com/macros/s/AKfycbyP5nANrwgwDyLohoRYe5Ns3JGbYp2Ce1sx0R0fXLGZUaJsHkfHmidOpIn4NfVJeCobpQ/exec';
const q=new URLSearchParams(location.search),mode=q.get('mode')||'display',app=document.querySelector('#app'),notice=document.querySelector('#notice'),audioButton=document.querySelector('#audioButton');
if(['display','preview'].includes(mode))document.body.classList.add('presentation');
let state,conf={settings:{},lecturers:[]},key='',last='',session='',busy=false,writing=false,epoch=0,offset=0,connected=false,message='',music=null,narration=null,spoken='',audioEnabled=false,ready=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function url(v){try{const u=new URL(v);return u.protocol==='https:'?esc(u.href):''}catch{return ''}}
function report(){notice.textContent=(mode==='admin'?(connected?'CONNECTED | ':'DISCONNECTED | '):'')+message;}
async function api(action='status',extra={}){
 const read=['status','config'].includes(action),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try{const params=new URLSearchParams({action,...extra,_:Date.now()});const r=await fetch(read?API+'?'+params:API,{method:read?'GET':'POST',...(read?{}:{body:params}),redirect:'follow',signal:controller.signal});const text=await r.text();if(!r.ok)throw Error('HTTP '+r.status);let j;try{j=JSON.parse(text)}catch{throw Error('Respons bukan JSON. Semak deployment dan akses Anyone.')}if(j.version!=='2.4')throw Error('Backend bukan V2.4. Deploy New version dahulu.');if(!j.ok)throw Error(j.error);return j;}catch(e){throw Error(e.name==='AbortError'?'API timeout; semak status sebelum ulang arahan':e.message)}finally{clearTimeout(timer)}
}
function accept(r){state=r.state;offset=(r.serverTime||Date.now())-Date.now();connected=true;render();}
function stopAudio(){openingCue=-1;window.speechSynthesis?.cancel();if(narration){narration.pause();narration=null}if(music){music.pause();music.currentTime=0}spoken='';}
function syncAudio(phase,paused){if(!audioEnabled||mode==='admin'||mode==='unlock')return;if(music){if(phase==='standby'||paused)music.pause();else music.play().catch(()=>{});}if(paused){window.speechSynthesis?.pause();narration?.pause()}else{window.speechSynthesis?.resume();if(narration&&!narration.ended)narration.play().catch(()=>{})}}
audioButton.onclick=()=>{audioEnabled=true;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume().catch(()=>{})}catch(e){}if(conf.settings.music&&!music){music=new Audio(conf.settings.music);music.loop=true;music.volume=.3;music.play().then(()=>{if(state?.phase==='standby')music.pause()}).catch(()=>{})}document.documentElement.requestFullscreen?.().catch(()=>{});audioButton.hidden=true;};
function speak(r,k){if(spoken===k)return;spoken=k;window.speechSynthesis?.cancel();if(narration){narration.pause();narration=null}if(!audioEnabled||String(conf.settings.narrator).toUpperCase()!=='ON')return;if(url(r[14])){narration=new Audio(r[14]);narration.play().catch(()=>{});}else if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(r[13]||r[1]+' '+r[2]);u.lang='ms-MY';speechSynthesis.speak(u)}}
function openingDuration(){const n=Number(conf.settings.opening_seconds||35);return Number.isFinite(n)?Math.max(20,Math.min(90,n)):35}
function duration(r){const n=Number(r[11]||conf.settings.seconds||30);return Number.isFinite(n)&&n>0?n:30}
function scene(){let s=state,t=Math.max(0,(s.paused?s.elapsed:Date.now()+offset-s.at)/1000),phase=s.phase,i=s.index,ls=conf.lecturers;const opening=openingDuration();if(phase==='opening'&&t>=opening){phase='profile';t-=opening;i=0}if(phase==='profile'){while(i<ls.length&&t>=duration(ls[i])+3){t-=duration(ls[i])+3;i++}if(i>=ls.length)phase='finale'}return {phase,i,t,n:s.locks.filter(Boolean).length}}
function render(){if(!state||!ready)return;if(session!==state.session){session=state.session;last='';stopAudio()}const {phase,i,t,n}=scene(),s=state,ls=conf.lecturers,settings=conf.settings;document.body.classList.toggle('paused',s.paused);const stamp=[mode,session,phase,i,n,s.at].join('|');
 if(mode==='admin'){const el=document.querySelector('#status');if(el)el.textContent=`${n*25}% | ${phase} | Profil ${Math.min(i+1,ls.length)}/${ls.length} | ${Math.floor(t)}s | ${s.paused?'PAUSED':'AUTO PLAY'}${phase==='profile'?' | Baki '+Math.max(0,Math.ceil(duration(ls[i])+3-t))+'s':''}`;return}
 if(mode==='unlock'){if(stamp===last)return;last=stamp;const on=s.locks[Number(q.get('id'))-1];app.innerHTML=`<h1>EDU NEXUS</h1><div id="reactor">${on?'✓':'🔒'}</div><h2>PERASMI ${esc(q.get('id'))}</h2>${on?'<p>ENERGY TRANSFERRED</p>':phase!=='standby'?'<p>WAITING FOR RESET</p>':!q.get('token')?'<p>Pautan tidak lengkap. Dapatkan pautan daripada admin.</p>':'<p>SLIDE TO UNLOCK</p><input class="slider" type="range" min="0" max="100" value="0" aria-label="Slide to unlock" oninput="if(this.value==100){this.disabled=true;unlock()}">'}`;return}
 syncAudio(phase,s.paused);
 if(stamp!==last){last=stamp;if(phase==='standby'){app.innerHTML=`<small>QUAD ENERGY ACTIVATION</small><h1>EDU NEXUS</h1><div id="reactor">${n*25}%</div><div class="nodes">${s.locks.map((v,j)=>`<div class="node ${v?'on':''}">UNIT 0${j+1}<br>${v?'VERIFIED':'LOCKED'}</div>`).join('')}</div>`}
 else if(phase==='opening'){app.innerHTML=openingMarkup(); openingCue=-1}
 else if(phase==='profile'){const r=ls[i];app.innerHTML=`<small>PERSONNEL IDENTITY // ${i+1}</small><div class="profile"><div class="portrait">${url(r[10])?`<img src="${url(r[10])}">`:'<h1>◈</h1>'}<div class="scan"></div><div class="platform"></div></div><section><h1 id="person"></h1><div id="cards"></div><div id="profileProgress"><span></span></div><div id="profileMeta"></div></section></div>`;speak(r,stamp)}
 else{window.speechSynthesis?.cancel();if(narration){narration.pause();narration=null}app.innerHTML=`<h1>${esc(settings.title||'EDU NEXUS')}</h1>${url(settings.logo)?`<img class="logo" src="${url(settings.logo)}">`:''}<h2>MEET OUR LECTURERS</h2><div class="team">${ls.map(r=>`<div>${url(r[10])?`<img src="${url(r[10])}">`:''}<p>${esc(r[1])}</p></div>`).join('')}</div>`}}
 if(phase==='opening')drawOpening(t,s.paused);
 if(phase==='profile'){const r=ls[i],p=t/duration(r);document.querySelector('#person').textContent=r[1].slice(0,Math.max(0,Math.floor((p-.15)*r[1].length*8)));document.querySelector('#profileProgress span').style.width=Math.min(100,p*100)+'%';document.querySelector('#profileMeta').textContent=`PROFILE ${i+1} / ${ls.length} • ${t>=duration(r)?'TRANSITION':'AUTO PLAYBACK'}`;const cards=document.querySelector('#cards');['Jawatan','Jabatan','Akademik','Profesional','Pengalaman','Kepakaran','Pencapaian','Moto'].forEach((f,j)=>{if(r[j+2]&&p>.25+j*.075&&!document.getElementById('f'+j)){const d=document.createElement('div');d.id='f'+j;d.className='card';d.innerHTML=`<small>${f}</small><br>${esc(r[j+2])}`;cards.append(d)}});fitProfile()}
}
function fitProfile(){const section=document.querySelector('.profile section');if(!section)return;const cards=document.querySelector('#cards');const max=section.clientHeight; if(!max)return;cards.style.zoom='1';const available=Math.max(30,max-document.querySelector('#person').offsetHeight-45);if(cards.scrollHeight>available)cards.style.zoom=String(Math.min(1,available/cards.scrollHeight));}
let configChecked=0;
async function poll(){if(busy||writing||mode==='preview')return;busy=true;const v=epoch;try{const refresh=Date.now()-configChecked>15000;const r=await api(refresh?'config':'status');if(v===epoch&&!writing){if(refresh){const changed=JSON.stringify(conf)!==JSON.stringify(r.data);conf=r.data;configChecked=Date.now();if(changed)last='';}accept(r);if(mode!=='admin')message='';report()}}catch(e){if(v===epoch){connected=false;message=e.message;report()}}finally{busy=false}}
async function mutate(action,extra){if(writing)return;writing=true;epoch++;document.querySelectorAll('button.command').forEach(b=>b.disabled=true);message='Menghantar '+action+'…';report();try{const r=await api(action,extra);if(['reset','standby','stop'].includes(action)&&(r.state.phase!=='standby'||r.state.locks.some(Boolean)))throw Error('Reset tidak disahkan');if(action==='opening_settings'&&r.data){conf=r.data;last='';}accept(r);message=['reset','standby','stop'].includes(action)?'RESET BERJAYA — 0% / 4 LOCKED':'Arahan berjaya: '+action;}catch(e){message='Arahan gagal: '+e.message;last='';render()}finally{writing=false;document.querySelectorAll('button.command').forEach(b=>b.disabled=false);report()}}
function adminCommand(a){return mutate(a,{key})}
function unlock(){return mutate('unlock',{id:q.get('id'),token:q.get('token'),session:state.session})}
async function login(){key=document.querySelector('#key').value.trim();try{const r=await api('links',{key});app.innerHTML='<h1>COMMAND CENTER V2.4</h1><p id="status"></p><div>'+Object.entries({start:'Emergency Start',pause:'Pause',resume:'Resume',prev:'Previous',next:'Next',replay:'Replay Profile',profiles:'Skip Opening',finale:'Finale',restart:'Replay Presentation',stop:'Stop',reset:'RETURN TO STANDBY / RESET SYSTEM'}).map(([a,b])=>`<button class="command" data-command="${a}">${b}</button>`).join('')+'</div>'+openingControls()+'<h2>Device links</h2>'+r.data.map(d=>{const u=new URL(location.href);u.search=new URLSearchParams({mode:'unlock',id:d[0],token:d[1]});return `<p><a href="${esc(u.href)}" target="_blank" rel="noopener">Perasmi ${esc(d[0])}</a> <button onclick="navigator.clipboard.writeText(this.previousElementSibling.href).catch(()=>{message='Copy gagal; salin pautan secara manual';report()})">Copy</button></p>`}).join('');app.querySelectorAll('button[data-command]').forEach(b=>b.addEventListener('click',()=>adminCommand(b.dataset.command)));document.querySelector('#saveOpening').addEventListener('click',saveOpening);accept(r);message='Admin authenticated';report()}catch(e){message=e.message;report()}}

let openingCue=-1,ac=null;
function openingControls(){const s=conf.settings;const sel=(id,v,def)=>`<select id="${id}"><option ${String(v||def)==='ON'?'selected':''}>ON</option><option ${String(v||def)==='OFF'?'selected':''}>OFF</option></select>`;return `<div class="qsettings"><h2>Quantum Opening</h2><label>Effect ${sel('oe',s.opening_effect,'ON')}</label><label>Duration (s) <input id="od" type="number" min="20" max="90" value="${openingDuration()}"></label><label>Spark intensity <input id="oi" type="number" min="0" max="100" value="${esc(s.spark_intensity||'75')}"></label><label>Sound ${sel('os',s.opening_sound,'ON')}</label><label>Narrator ${sel('on',s.opening_narrator,'OFF')}</label><button id="saveOpening">Save opening settings</button><a href="?mode=preview&v=24" target="_blank" rel="noopener">Preview Opening</a></div>`}
function saveOpening(){if(state?.phase!=='standby'){message='Reset ke standby sebelum mengubah tetapan opening.';report();return}const val=id=>document.getElementById(id).value;mutate('opening_settings',{key,effect:val('oe'),seconds:val('od'),intensity:val('oi'),sound:val('os'),narrator:val('on')})}
function openingMarkup(){return '<div class="quantum"><canvas id="quantumCanvas"></canvas><div class="qcontent"><small>EDU NEXUS // 2026</small><div class="qstage" id="qstage"></div><div id="qtitle"></div><div class="qbar"><span id="qprogress"></span></div></div></div>'}
function cueSound(i){if(!audioEnabled||!ac||conf.settings.opening_sound==='OFF')return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=i===1?'triangle':'sine';o.frequency.setValueAtTime(i===1?150:300+i*75,t);o.frequency.exponentialRampToValueAtTime(i===1?42:110,t+.55);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.13,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+.65);o.connect(g).connect(ac.destination);o.start();o.stop(t+.7)}catch(e){}}
function drawOpening(t,paused){const d=openingDuration(),u=t/d*35,stage=u<5?0:u<10?1:u<15?2:u<20?3:u<28?4:5;const labels=['ENERGY CONVERGENCE','QUANTUM FUSION','SYSTEM INITIALIZATION','INSTITUTIONAL LOGO REVEAL','GRAND TITLE REVEAL','PERSONNEL MATERIALIZATION'];const el=document.getElementById('qstage'),title=document.getElementById('qtitle');if(!el||!title)return;document.getElementById('qprogress').style.width=Math.min(100,t/d*100)+'%';if(stage!==openingCue){openingCue=stage;el.textContent=labels[stage];title.innerHTML=stage===3?(url(conf.settings.logo)?`<img src="${url(conf.settings.logo)}" alt="Logo kolej">`:'<h1>EDU NEXUS</h1>'):stage===4?'<div class="qtitle"><h1>MAJLIS PENGENALAN PENSYARAH BAHARU</h1><h2>KOLEJ VOKASIONAL SETAPAK</h2></div>':stage===5?'<h1>WAJAH BAHARU. ASPIRASI BAHARU.</h1>':'<h1>'+['04 ENERGY SOURCES','100%','SYSTEM ONLINE'][stage]+'</h1>';if(!paused){cueSound(stage);if(stage===0&&audioEnabled&&conf.settings.opening_narrator==='ON'&&window.speechSynthesis){const v=new SpeechSynthesisUtterance('Empat tenaga. Satu aspirasi. Menyatukan kepakaran, mencipta inspirasi dan membentuk generasi masa hadapan. Dengan penuh takzim, kami mempersembahkan Majlis Pengenalan Pensyarah Baharu Kolej Vokasional Setapak. Wajah baharu. Semangat baharu. Aspirasi baharu.');v.lang='ms-MY';v.rate=.9;speechSynthesis.speak(v)}}}const c=document.getElementById('quantumCanvas');if(!c)return;const w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;if(c.width!==w||c.height!==h){c.width=w;c.height=h}const x=c.getContext('2d');x.clearRect(0,0,w,h);if(conf.settings.opening_effect==='OFF')return;const cx=w/2,cy=h/2,R=Math.min(w,h)*.32;const power=Math.max(0,Math.min(100,Number(conf.settings.spark_intensity??75)||0));x.save();x.translate(cx,cy);if(stage===1&&u<5.7){x.translate(Math.sin(t*55)*4,Math.cos(t*47)*4)}for(let j=0;j<7;j++){x.save();x.rotate(t*(j%2?-.17:.13)+j);x.strokeStyle=j%2?'#d4af3788':'#22d3ee88';x.lineWidth=j%3+1;x.setLineDash([12+j*5,8+j*3]);x.beginPath();x.arc(0,0,R*(.45+j*.12),0,Math.PI*2);x.stroke();x.restore()}x.setLineDash([]);for(let j=0;j<4;j++){const a=j*Math.PI/2+Math.PI/4,rr=R*2.8;const grad=x.createLinearGradient(Math.cos(a)*rr,Math.sin(a)*rr,0,0);grad.addColorStop(0,'#22d3ee00');grad.addColorStop(1,stage===1?'#ffd97c':'#22d3ee');x.strokeStyle=grad;x.lineWidth=stage===0?5:2;x.beginPath();x.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);for(let k=9;k>=0;k--){const z=k/10*rr;x.lineTo(Math.cos(a)*z+Math.sin(k*8+t*12+j)*12*(k/10),Math.sin(a)*z+Math.cos(k*7+t*10)*10*(k/10))}x.stroke()}for(let j=0;j<Math.round(power*1.8);j++){const a=j*2.39996,age=(t*(stage===1?1.8:.55)+j*.173)%1,r=R*(.25+age*1.8),px=Math.cos(a)*r,py=Math.sin(a)*r;x.globalAlpha=(1-age)*.8;x.strokeStyle=j%3?'#22d3ee':'#ffd97c';x.lineWidth=1.5;x.beginPath();x.moveTo(px,py);x.lineTo(px-Math.cos(a)*18,py-Math.sin(a)*18);x.stroke()}x.globalAlpha=1;if(stage===1){x.strokeStyle='#ffd97c';x.lineWidth=3;x.globalAlpha=Math.max(0,1-(u-5)/5);x.beginPath();x.arc(0,0,R*(.2+(u-5)*.5),0,Math.PI*2);x.stroke()}x.restore();}

async function init(){if(mode==='admin')app.innerHTML='<h1>EDU NEXUS ADMIN V2.4</h1><input id="key" type="password" placeholder="Admin key"><button onclick="login()">Login</button>';else if(mode!=='unlock')audioButton.hidden=false;try{const r=await api('config');conf=r.data;configChecked=Date.now();ready=true;accept(r);if(mode==='preview'){state={...state,session:'preview',phase:'opening',at:Date.now()+offset,locks:[true,true,true,true],index:0,paused:false,elapsed:0};render()}report()}catch(e){message=e.message;report();setTimeout(init,5000);return}setInterval(poll,2200);setInterval(render,150);function frame(){if(state&&ready&&['display','preview'].includes(mode)&&scene().phase==='opening'&&!state.paused)drawOpening(scene().t,false);requestAnimationFrame(frame)}requestAnimationFrame(frame)}init();
</script></html>
